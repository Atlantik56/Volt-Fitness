services:
  volt:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - volt-data:/app/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
volumes:
  volt-data:
